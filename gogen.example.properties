# gogen 配置文件示例（properties 格式）。
#
# 使用方式:
#   gogen server -config=gogen.properties file.go
#   gogen client -config=gogen.properties file.go
#
# 在 go generate 中可以用 GOGEN_ROOT_DIRECTORY 指定项目根目录，
# -config 的相对路径会相对它解析；未指定 -config 时会自动查找
# $GOGEN_ROOT_DIRECTORY/gogen.properties 或 .gogen.properties。
#
# 空行以及以 # 或 ! 开头的行会被忽略，键和值可以用 = 或 : 分隔。
# 文件编码支持 UTF-8（带或不带 BOM）、UTF-16 LE/BE、UTF-32 LE/BE。
# 优先级: 命令行参数 > GOGEN_ 环境变量 > 配置文件 > 默认值。
# server 和 client 只读取各自相关的配置项，其余项会被忽略。

# ---------- 通用配置 ----------

# 额外导入的包，多个包时以逗号分隔。
imports=example.com/project/errors,example.com/project/model

# errors 包的导入路径，默认 errors。
errors=example.com/project/errors

# 转换函数的前缀。
convert_ns=

# 自定义的转换类型，多个类型时以逗号分隔。
convert_param_types=

# context.Context 参数从请求中取值时使用的表达式。
contextGetter=

# echo 插件的版本，设置为 v5 时使用 echo v5。
echoVersion=

# ---------- server 子命令 ----------

# 生成框架: chi, gin, echo, echov5, iris, loong。
plugin=echo

# 生成文件的后缀名，默认 .<plugin>-gen.go。
server_ext=

# 生成 go build tag。
build_tag=

# 错误处理相关的函数名。
httpCodeWith=
badArgument=
toEncodedError=

# 是否默认启用 @x-gogen-result-wrap。
enableResultWrap=false

# 结果包装相关的函数名。
okResult=
errorResult=
customReturn=

# 是否生成 httpCodeWith 函数。
outputHttpCodeWith=false

# ---------- client 子命令 ----------

# 生成文件的后缀名，默认 .client-gen.go。
client_ext=

# 结构体字段的 tag 名，默认 json。
tag=json

# resty 相关的配置。
field=Proxy
resty=*resty.Proxy
context=context.Context
new-request=resty.NewRequest({{.proxy}},{{.url}})
free-request=resty.ReleaseRequest({{.proxy}},{{.request}})
timeFormat=client.Proxy.TimeFormat

# 是否使用统一的结果包装类型。
has-wrapper=false
wrapper-type=loong.Result
wrapper-data=Data
wrapper-error=Error
